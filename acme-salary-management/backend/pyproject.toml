[project]
name = "acme-salary-backend"
version = "1.0.0"
description = "ACME Salary Management System - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
server = ["uvicorn>=0.30"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = []
